services:
  construction-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: construction-manager
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
      - DB_PATH=/data/construction.db
      - S3_ENDPOINT=${S3_ENDPOINT:-https://s3.twcstorage.ru}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_REGION=${S3_REGION:-ru-1}
      - DB_FILE_NAME=${DB_FILE_NAME:-construction.db}
      - UPLOAD_INTERVAL=${UPLOAD_INTERVAL:-300}
    volumes:
      - cm_data:/data
    restart: unless-stopped
    command: >
      sh -c "/sync_db_to_s3.sh & ./main"

volumes:
  cm_data:
