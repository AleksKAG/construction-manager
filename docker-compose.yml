services:
  app:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      ENV: production
      # Опционально: путь к БД, если хотите переопределить
      # DB_PATH: /app/data/app.db
    volumes:
      - app-data:/app/data  # ← Persist SQLite file!
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # Опционально: лимиты ресурсов
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512M
    #       cpus: '0.5'

volumes:
  app-data: