services:
  app:
    build:
      context: .
      dockerfile: deployments/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ENV: production
      PORT: 8080
      DB_PATH: /app/data/app.db
      JWT_SECRET: ${JWT_SECRET:-timeweb_dev_secret_2026}
      GIN_MODE: release
    volumes:
      - app-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  app-data: