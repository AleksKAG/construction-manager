services:
  construction-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: construction-manager
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/construction_manager?sslmode=disable}
      - APP_DB_ENGINE=${APP_DB_ENGINE:-postgres}
      - RUN_DB_MIGRATIONS=${RUN_DB_MIGRATIONS:-false}
      - DB_WAIT_MAX_ATTEMPTS=${DB_WAIT_MAX_ATTEMPTS:-40}
      - DB_WAIT_DELAY_SECONDS=${DB_WAIT_DELAY_SECONDS:-2}
      # PostgreSQL backup to S3 settings
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-construction_manager}
      - S3_ENDPOINT=${S3_ENDPOINT:-https://s3.twcstorage.ru}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_REGION=${S3_REGION:-ru-1}
      - BACKUP_PREFIX=${BACKUP_PREFIX:-postgres_backup}
      - UPLOAD_INTERVAL=${UPLOAD_INTERVAL:-86400}
      - RETENTION_DAYS=${RETENTION_DAYS:-7}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: ["./main"]
    # Uncomment the following lines to enable automatic PostgreSQL backups to S3
    # entrypoint: ["/bin/sh", "-c", "/backup_postgres_to_s3.sh & exec /entrypoint.sh ./main"]

  postgres:
    image: postgres:16-alpine
    container_name: construction-manager-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-construction_manager}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-construction_manager}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
