services:
  app:
    build:
      context: .
      dockerfile: deployments/Dockerfile
    ports:
      - "8080:8080"
    environment:
      # App settings
      PORT: 8080
      ENV: production
      GIN_MODE: release
      
      # SQLite settings
      DB_PATH: /app/data/app.db
      
      # Optional: JWT secret for auth (if you add auth later)
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production_2026}
    volumes:
      - app-data:/app/data  # ← Persist SQLite database!
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # Optional: resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'