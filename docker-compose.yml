services:
  construction-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: construction-manager
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/construction_manager?sslmode=disable}
      - APP_DB_ENGINE=${APP_DB_ENGINE:-sqlite}
      - RUN_DB_MIGRATIONS=${RUN_DB_MIGRATIONS:-false}
      - DB_WAIT_MAX_ATTEMPTS=${DB_WAIT_MAX_ATTEMPTS:-40}
      - DB_WAIT_DELAY_SECONDS=${DB_WAIT_DELAY_SECONDS:-2}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: ["./main"]

  postgres:
    image: postgres:16-alpine
    container_name: construction-manager-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-construction_manager}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-construction_manager}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
