<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Construction Manager</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- Экран авторизации — показывается при старте до проверки токена -->
<div id="loginOverlay" style="display:none; position:fixed; inset:0; z-index:9999; background:var(--bg-color,#f0f2f5); align-items:center; justify-content:center;">
  <div style="width:100%; max-width:400px; padding:32px 24px; background:var(--card-bg,#fff); border-radius:16px; box-shadow:0 4px 32px rgba(0,0,0,0.10);">
    <div style="text-align:center; margin-bottom:28px;">
      <div style="display:inline-flex; align-items:center; justify-content:center; width:56px; height:56px; background:var(--accent-color,#2563eb); border-radius:14px; font-size:1.5em; font-weight:700; color:#fff; margin-bottom:12px;">CM</div>
      <div style="font-size:1.3em; font-weight:700; color:var(--text-color,#1a202c);">Construction Manager</div>
      <div style="font-size:0.875em; color:var(--text-muted,#6b7280); margin-top:4px;">Технический заказчик</div>
    </div>
    <form id="loginOverlayForm" style="display:flex; flex-direction:column; gap:14px;" autocomplete="on">
      <div>
        <label style="font-size:0.85em; font-weight:500; color:var(--text-muted,#6b7280); display:block; margin-bottom:6px;">Логин</label>
        <input type="text" id="loginOverlayField" name="username" placeholder="admin" autocomplete="username" required
          style="width:100%; box-sizing:border-box; padding:10px 14px; border:1px solid var(--border-color,#e2e8f0); border-radius:8px; font-size:1em; background:var(--input-bg,#f8fafc); outline:none;">
      </div>
      <div>
        <label style="font-size:0.85em; font-weight:500; color:var(--text-muted,#6b7280); display:block; margin-bottom:6px;">Пароль</label>
        <input type="password" id="passwordOverlayField" name="password" placeholder="••••••••" autocomplete="current-password" required
          style="width:100%; box-sizing:border-box; padding:10px 14px; border:1px solid var(--border-color,#e2e8f0); border-radius:8px; font-size:1em; background:var(--input-bg,#f8fafc); outline:none;">
      </div>
      <button type="submit" class="primary" style="padding:11px; font-size:1em; border-radius:8px; margin-top:4px;">Войти</button>
      <div id="loginOverlayError" style="color:var(--danger-color,#e53e3e); font-size:0.875em; text-align:center; min-height:18px;"></div>
    </form>
  </div>
</div>

<div class="layout" id="appLayout" style="visibility:hidden;">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar" aria-hidden="false">
    <div class="sidebar-top">
      <div class="brand">
        <div class="brand-mark">CM</div>
        <div>
          <div class="brand-title">Construction Manager</div>
          <div class="brand-subtitle" data-view="auth">Технический заказчик</div>
        </div>
      </div>
      <button class="sidebar-close" id="sidebarCloseBtn" aria-label="Закрыть меню">✕</button>
    </div>

    <div class="section-title">Основное</div>
    <nav class="menu">
      <button class="menu-item active" data-view="home">Главная</button>
      <button class="menu-item" data-view="projects">Проекты</button>
      <button class="menu-item" data-view="fileManager">📄 Документация</button>
      <button class="menu-item" data-view="aiAssistant">🤖 ИИ ассистент</button>
      <button class="menu-item" data-view="auth">Авторизация и роли</button>
    </nav>

    <div class="section-title">Проекты</div>
    <div id="projectTree" class="tree"></div>
  </aside>

  <main class="content" id="mainContent">
    <header class="header">
      <button id="mobileMenuBtn" class="ghost mobile-only" aria-label="Открыть меню">☰</button>
      <h1 id="pageTitle">Главная</h1>
      <label class="project-switcher" title="Активный проект">
        <span>Проект</span>
        <select id="projectSwitcher"></select>
      </label>
      <button id="secondaryBtn" class="ghost" style="display:none"></button>
      <button id="primaryBtn" class="primary">+ Добавить проект</button>
    </header>

    <section id="contentArea" class="grid"></section>
  </main>
</div>

<div class="modal" id="entityModal">
  <div class="overlay" data-close="true"></div>
  <div class="dialog">
    <h3 id="modalTitle">Действие</h3>
    <div id="modalBody"></div>
    <div class="actions">
      <button class="ghost" data-close="true">Отмена</button>
      <button class="primary" id="saveEntity">Сохранить</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script type="module" src="/static/js/app.js"></script>
<script type="module" src="/static/js/documentUploader.js"></script>
</body>
</html>
