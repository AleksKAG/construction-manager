<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Construction Manager</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="layout">
    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <div class="brand-mark">CM</div>
            <div>
                <div class="brand-title">Construction Manager</div>
                <div class="brand-subtitle">Технический заказчик</div>
            </div>
        </div>

        <nav class="menu">
            <button class="menu-item active" data-view="dashboard">Главная</button>
            <button class="menu-item" data-view="tasks">Мои задачи</button>
        </nav>

        <div class="section-title">Проекты</div>
        <div id="projectTree" class="project-tree"></div>

        <button class="menu-item secondary" id="addProjectBtn">+ Добавить проект</button>
    </aside>

    <main class="content">
        <header class="header">
            <button id="toggleSidebar" class="ghost">☰</button>
            <h1 id="pageTitle">Главная</h1>
        </header>

        <section id="contentArea" class="grid"></section>
    </main>
</div>

<!-- Modal -->
<div class="modal" id="projectModal">
    <div class="overlay" data-close="true"></div>
    <div class="dialog">
        <h3>Новый проект</h3>
        <input id="projectName" type="text" placeholder="Название проекта" />
        <textarea id="projectDescription" placeholder="Описание / адрес"></textarea>
        <div class="actions">
            <button data-close="true">Отмена</button>
            <button id="saveProjectBtn">Сохранить</button>
        </div>
    </div>
</div>

<script type="module" src="/static/js/app.js"></script>
</body>
</html>
