<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Construction Manager</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <div class="brand-mark">CM</div>
            <div>
                <div class="brand-title">Construction Manager</div>
                <div class="brand-subtitle">Технический заказчик</div>
            </div>
        </div>

        <div class="section-title">Основное</div>
        <nav class="menu">
            <button class="menu-item active" data-view="home">Главная</button>
            <button class="menu-item" data-view="projects">Проекты</button>
            <button class="menu-item" data-view="designSchedule">График проектирования</button>
            <button class="menu-item" data-view="tep">ТЭП</button>
            <button class="menu-item" data-view="estimate">Смета</button>
            <button class="menu-item active" data-view="dashboard">Главная (Дашборд)</button>
            <button class="menu-item" data-view="tasks">Мои задачи</button>
            <button class="menu-item" data-view="auth">Авторизация и роли</button>
        </nav>

        <div class="section-title">Дерево проектов</div>
        <div id="projectTree" class="tree"></div>

        <button class="menu-item secondary" id="menuEditor">Редактировать меню</button>
    </aside>

    <!-- Main Content -->
    <main class="content">
        <header class="header">
            <button id="toggleSidebar" class="ghost">☰</button>
            <h1 id="pageTitle">Главная</h1>
            <button id="addProjectBtn" class="primary">+ Добавить проект</button>
        </header>

        <section id="contentArea" class="grid"></section>
    </main>
</div>

<!-- Modal -->
<div class="modal" id="projectModal">
    <div class="overlay" data-close="true"></div>
    <div class="dialog">
        <h3>Добавить новый проект</h3>
        <label>Наименование проекта<br>
            <input id="projectName" type="text" placeholder="Например: Жилой комплекс Солнечный">
        </label>
        <label>Адрес / Описание<br>
            <textarea id="projectDescription" rows="3" placeholder="Краткое описание"></textarea>
        </label>
        <div class="actions">
            <button class="ghost" data-close="true">Отмена</button>
            <button class="primary" id="saveProjectBtn">Сохранить проект</button>
        </div>
    </div>
</div>

<script type="module" src="/static/js/app.js"></script>
</body>
</html>
