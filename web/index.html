<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Construction Manager — Портфель проектов</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="layout">
    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <div class="brand-mark">CM</div>
            <div>
                <div class="brand-title">Construction Manager</div>
                <div class="brand-subtitle">Технический заказчик</div>
            </div>
        </div>

        <div class="section-title">Основное</div>
        <nav class="menu">
            <button class="menu-item active" data-view="home">Главная</button>
            <button class="menu-item" data-view="tasks">Мои задачи</button>
            <button class="menu-item" data-view="account">Аккаунт</button>
            <button class="menu-item" data-view="auth">Авторизация и роли</button>
        </nav>

        <div class="section-title">Проекты</div>
        <div id="projectTree" class="tree"></div>

        <button class="menu-item secondary" id="menuEditor">Редактировать меню (для аккаунта)</button>
    </aside>

    <main class="content">
        <header class="header">
            <button id="toggleSidebar" class="ghost">☰</button>
            <h1 id="pageTitle">Главная</h1>
            <button id="addBtn" class="primary">+ Добавить проект</button>
        </header>

        <section id="contentArea" class="grid"></section>
    </main>
</div>

<div class="modal" id="projectModal">
    <div class="overlay" data-close="true"></div>
    <div class="dialog">
        <h3>Добавить проект</h3>
        <label>Наименование<input id="projectName" type="text" placeholder="Например: Наименование 3"></label>
        <label>Описание<textarea id="projectDescription" rows="3" placeholder="Краткое описание проекта"></textarea></label>
        <div class="actions">
            <button class="ghost" data-close="true">Закрыть</button>
            <button class="primary" id="saveProject">Сохранить</button>
        </div>
    </div>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
